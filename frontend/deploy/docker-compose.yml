# Локальный деплой (проверенный рецепт: skill web-deploy-local).
#
#   APP_PORT=4120 docker compose -f deploy/docker-compose.yml up -d --wait
#   curl -sS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:4120/healthz
#
# Порт берётся из зарезервированного диапазона 4100-4199 (см. AGENTS.md).
name: app-template

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: app-template:${TAG:-dev}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-4120}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 6
