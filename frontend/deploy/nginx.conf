server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Точка проверки для docker healthcheck и деплой-скриптов.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "healthy\n";
  }

  # Хэшированные ассеты Vite можно кэшировать навсегда.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA-фолбэк: любой неизвестный путь отдаёт index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
